<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garantía · GIFTEK</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a38;
    --accent: #4f8aff;
    --green: #34d399;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --font-head: 'Syne', sans-serif;
    --font-body: 'Instrument Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-family: var(--font-head); font-size: 20px; font-weight: 800; }
  .header span { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }

  .container { max-width: 860px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  /* FORM */
  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .form-panel h2 { font-family: var(--font-head); font-size: 16px; margin-bottom: 20px; color: var(--text); }

  .form-section { margin-bottom: 20px; }
  .form-section-title {
    font-size: 10px; color: var(--accent); text-transform: uppercase;
    letter-spacing: .1em; font-weight: 600; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .form-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text);
    font-family: var(--font-body); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group select option { background: var(--surface2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .garantia-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .garantia-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 4px; text-align: center;
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted);
    transition: all .15s; user-select: none;
  }
  .garantia-btn:hover { border-color: var(--accent); color: var(--accent); }
  .garantia-btn.active { background: rgba(79,138,255,.12); border-color: var(--accent); color: var(--accent); }

  .cobertura-list { display: flex; flex-direction: column; gap: 6px; }
  .cobertura-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
    transition: all .15s;
  }
  .cobertura-item:hover { border-color: var(--accent); }
  .cobertura-item.active { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.4); }
  .cobertura-item input[type=checkbox] { accent-color: var(--green); width: 14px; height: 14px; }
  .cobertura-item label { font-size: 12px; cursor: pointer; flex: 1; }

  .btn-generate {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-family: var(--font-head);
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s;
    margin-top: 8px;
  }
  .btn-generate:hover { background: #3a78f0; transform: translateY(-1px); }

  /* PREVIEW */
  .preview-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .preview-panel h2 { font-family: var(--font-head); font-size: 16px; color: var(--text); }

  /* GARANTIA CARD PREVIEW */
  .garantia-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    font-family: 'Instrument Sans', sans-serif;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
    color: #111;
  }
  .gc-header {
    background: #111110;
    padding: 20px 22px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .gc-brand { color: #fff; }
  .gc-brand h3 { font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .gc-brand p { font-size: 10px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
  .gc-badge {
    background: rgba(52,211,153,.15); border: 1px solid rgba(52,211,153,.4);
    color: #34d399; border-radius: 20px; padding: 4px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  .gc-title-bar {
    background: #4f8aff;
    padding: 8px 22px;
    font-size: 11px; font-weight: 700; color: #fff;
    text-transform: uppercase; letter-spacing: .1em;
  }
  .gc-body { padding: 18px 22px; }
  .gc-num { font-size: 10px; color: #888; margin-bottom: 14px; font-weight: 600; }

  .gc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .gc-field label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 2px; }
  .gc-field p { font-size: 12px; font-weight: 600; color: #111; }

  .gc-divider { height: 1px; background: #f0ede6; margin: 12px 0; }

  .gc-cobertura { margin-bottom: 14px; }
  .gc-cobertura h4 { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .gc-cob-list { display: flex; flex-direction: column; gap: 4px; }
  .gc-cob-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #333; }
  .gc-cob-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; flex-shrink: 0; }

  .gc-notas { background: #f9f8f5; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  .gc-notas h4 { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .gc-notas p { font-size: 11px; color: #555; }

  .gc-vigencia {
    background: #111110; border-radius: 8px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .gc-vigencia-label { font-size: 10px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .06em; }
  .gc-vigencia-dates { text-align: right; }
  .gc-vigencia-dates p { font-size: 11px; color: #fff; font-weight: 600; }
  .gc-vigencia-dates span { font-size: 10px; color: rgba(255,255,255,.4); }

  .gc-footer {
    background: #f5f4f0;
    padding: 12px 22px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .gc-footer p { font-size: 9px; color: #888; }
  .gc-firma { text-align: right; }
  .gc-firma-line { width: 100px; height: 1px; background: #ccc; margin-bottom: 3px; margin-left: auto; }
  .gc-firma p { font-size: 9px; color: #888; }

  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>GIFTEK</h1>
    <span>Generador de Garantía</span>
  </div>
</div>

<div class="container">

  <!-- FORMULARIO -->
  <div class="form-panel">
    <h2>📋 Datos de la garantía</h2>

    <div class="form-section">
      <div class="form-section-title">Cliente</div>
      <div class="form-group">
        <label>Nombre completo *</label>
        <input id="f-cliente" type="text" placeholder="Ej: María González" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>DNI</label>
          <input id="f-dni" type="text" placeholder="Ej: 35.123.456" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input id="f-tel" type="text" placeholder="353 4123456" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Equipo</div>
      <div class="form-group">
        <label>Modelo *</label>
        <input id="f-modelo" type="text" placeholder="Ej: iPhone 14 Pro Purple 128GB" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>IMEI / Serie</label>
          <input id="f-imei" type="text" placeholder="Ej: 354321..." oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label>Condición</label>
          <select id="f-condicion" onchange="updatePreview()">
            <option value="Nuevo">Nuevo</option>
            <option value="Usado">Usado</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio de venta</label>
          <input id="f-precio" type="text" placeholder="Ej: $ 850.000" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label>Método de pago</label>
          <select id="f-pago" onchange="updatePreview()">
            <option>Efectivo</option>
            <option>Transferencia</option>
            <option>Cuotas</option>
            <option>Trade-in</option>
            <option>Mercado Pago</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Garantía</div>
      <div class="garantia-options">
        <div class="garantia-btn" onclick="setDias(15)">15 días</div>
        <div class="garantia-btn active" onclick="setDias(30)">30 días</div>
        <div class="garantia-btn" onclick="setDias(60)">60 días</div>
        <div class="garantia-btn" onclick="setDias(90)">90 días</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha de compra</label>
          <input id="f-fecha" type="date" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label>Días de garantía</label>
          <input id="f-dias" type="number" value="30" min="1" max="365" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Cobertura incluida</div>
      <div class="cobertura-list">
        <div class="cobertura-item active" onclick="toggleCob(this)">
          <input type="checkbox" checked onchange="updatePreview()"> <label>Falla de fábrica / defecto de funcionamiento</label>
        </div>
        <div class="cobertura-item active" onclick="toggleCob(this)">
          <input type="checkbox" checked onchange="updatePreview()"> <label>Problemas de software / sistema operativo</label>
        </div>
        <div class="cobertura-item active" onclick="toggleCob(this)">
          <input type="checkbox" checked onchange="updatePreview()"> <label>Micrófono / altavoz / cámara</label>
        </div>
        <div class="cobertura-item active" onclick="toggleCob(this)">
          <input type="checkbox" checked onchange="updatePreview()"> <label>Conector de carga</label>
        </div>
        <div class="cobertura-item" onclick="toggleCob(this)">
          <input type="checkbox" onchange="updatePreview()"> <label>Batería (reemplazo si baja de 80%)</label>
        </div>
        <div class="cobertura-item" onclick="toggleCob(this)">
          <input type="checkbox" onchange="updatePreview()"> <label>Botones físicos</label>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Observaciones</div>
      <div class="form-group">
        <textarea id="f-notas" placeholder="Ej: Equipo entregado con funda y vidrio templado. Batería al 95%..." oninput="updatePreview()"></textarea>
      </div>
    </div>

    <button class="btn-generate" onclick="generarPDF()">⬇ Descargar PDF</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-panel">
    <h2>👁 Vista previa</h2>
    <div class="garantia-card" id="preview-card">
      <!-- Se genera con JS -->
    </div>
  </div>

</div>

<script>
const { jsPDF } = window.jspdf;

let diasGarantia = 30;

function setDias(d) {
  diasGarantia = d;
  document.getElementById('f-dias').value = d;
  document.querySelectorAll('.garantia-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === d + ' días');
  });
  updatePreview();
}

function toggleCob(el) {
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  el.classList.toggle('active', cb.checked);
  updatePreview();
}

function getCobertura() {
  return [...document.querySelectorAll('.cobertura-item')]
    .filter(el => el.querySelector('input').checked)
    .map(el => el.querySelector('label').textContent.trim());
}

function getFechaVto() {
  const fecha = document.getElementById('f-fecha').value;
  const dias  = parseInt(document.getElementById('f-dias').value) || diasGarantia;
  if (!fecha) return { desde: '—', hasta: '—' };
  const d = new Date(fecha + 'T12:00:00');
  const vto = new Date(d);
  vto.setDate(vto.getDate() + dias);
  const fmt = dt => dt.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
  return { desde: fmt(d), hasta: fmt(vto) };
}

function getNro() {
  return 'GIF-' + Date.now().toString().slice(-6);
}

function updatePreview() {
  const cliente  = document.getElementById('f-cliente').value || 'Nombre del cliente';
  const dni      = document.getElementById('f-dni').value || '—';
  const tel      = document.getElementById('f-tel').value || '—';
  const modelo   = document.getElementById('f-modelo').value || 'Modelo del equipo';
  const imei     = document.getElementById('f-imei').value || '—';
  const condicion= document.getElementById('f-condicion').value;
  const precio   = document.getElementById('f-precio').value || '—';
  const pago     = document.getElementById('f-pago').value;
  const notas    = document.getElementById('f-notas').value;
  const dias     = document.getElementById('f-dias').value || diasGarantia;
  const cob      = getCobertura();
  const { desde, hasta } = getFechaVto();

  document.getElementById('preview-card').innerHTML = buildCard({
    cliente, dni, tel, modelo, imei, condicion, precio, pago, notas, dias, cob, desde, hasta
  });
}

function buildCard({ cliente, dni, tel, modelo, imei, condicion, precio, pago, notas, dias, cob, desde, hasta }) {
  const cobHTML = cob.length
    ? cob.map(c => `<div class="gc-cob-item"><div class="gc-cob-dot"></div>${c}</div>`).join('')
    : '<div class="gc-cob-item"><div class="gc-cob-dot" style="background:#888"></div>Sin coberturas seleccionadas</div>';

  const notasHTML = notas
    ? `<div class="gc-notas"><h4>Observaciones</h4><p>${notas}</p></div>` : '';

  return `
    <div class="gc-header">
      <div class="gc-brand">
        <h3>GIFTEK</h3>
        <p>Villa María · Córdoba</p>
      </div>
      <div class="gc-badge">✓ GARANTÍA</div>
    </div>
    <div class="gc-title-bar">Certificado de Garantía · ${dias} días</div>
    <div class="gc-body">
      <div class="gc-num">N° ${getNro()}</div>

      <div class="gc-grid">
        <div class="gc-field"><label>Cliente</label><p>${cliente}</p></div>
        <div class="gc-field"><label>DNI</label><p>${dni}</p></div>
        <div class="gc-field"><label>Teléfono</label><p>${tel}</p></div>
        <div class="gc-field"><label>Condición</label><p>${condicion}</p></div>
      </div>

      <div class="gc-divider"></div>

      <div class="gc-grid">
        <div class="gc-field" style="grid-column:1/-1"><label>Equipo</label><p>${modelo}</p></div>
        <div class="gc-field"><label>IMEI / Serie</label><p>${imei}</p></div>
        <div class="gc-field"><label>Precio</label><p>${precio}</p></div>
        <div class="gc-field"><label>Método de pago</label><p>${pago}</p></div>
      </div>

      <div class="gc-divider"></div>

      <div class="gc-cobertura">
        <h4>Cobertura incluida</h4>
        <div class="gc-cob-list">${cobHTML}</div>
      </div>

      ${notasHTML}

      <div class="gc-vigencia">
        <div>
          <div class="gc-vigencia-label">Período de garantía</div>
          <p style="color:rgba(255,255,255,.35);font-size:10px;margin-top:2px">${dias} días corridos</p>
        </div>
        <div class="gc-vigencia-dates">
          <span>Desde</span>
          <p>${desde}</p>
          <span>Hasta</span>
          <p>${hasta}</p>
        </div>
      </div>

      <p style="font-size:9px;color:#aaa;line-height:1.5">
        La garantía no cubre daños por caídas, golpes, líquidos, mal uso o intervención de terceros no autorizados.
        Para hacer válida la garantía presentar este certificado.
      </p>
    </div>
    <div class="gc-footer">
      <div>
        <p>GIFTEK · Villa María, Córdoba</p>
        <p style="margin-top:2px">Consultas: WhatsApp</p>
      </div>
      <div class="gc-firma">
        <div class="gc-firma-line"></div>
        <p>Firma y sello</p>
      </div>
    </div>`;
}

function generarPDF() {
  const cliente  = document.getElementById('f-cliente').value || 'Cliente';
  const dni      = document.getElementById('f-dni').value || '—';
  const tel      = document.getElementById('f-tel').value || '—';
  const modelo   = document.getElementById('f-modelo').value || 'Equipo';
  const imei     = document.getElementById('f-imei').value || '—';
  const condicion= document.getElementById('f-condicion').value;
  const precio   = document.getElementById('f-precio').value || '—';
  const pago     = document.getElementById('f-pago').value;
  const notas    = document.getElementById('f-notas').value;
  const dias     = parseInt(document.getElementById('f-dias').value) || diasGarantia;
  const cob      = getCobertura();
  const { desde, hasta } = getFechaVto();
  const nro      = getNro();

  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, PL = 20, PR = 20, CW = W - PL - PR;

  // Helpers
  const hex = (h) => {
    const r = parseInt(h.slice(1,3),16)/255;
    const g = parseInt(h.slice(3,5),16)/255;
    const b = parseInt(h.slice(5,7),16)/255;
    return [r*255, g*255, b*255];
  };
  const setFill = (h) => doc.setFillColor(...hex(h));
  const setTxt  = (h) => doc.setTextColor(...hex(h));
  const setDraw = (h) => doc.setDrawColor(...hex(h));

  // HEADER BAR
  setFill('#111110'); doc.rect(0, 0, W, 38, 'F');
  setFill('#4f8aff'); doc.rect(0, 0, W, 3, 'F');

  // Brand
  doc.setFont('helvetica','bold');
  doc.setFontSize(24); setTxt('#ffffff');
  doc.text('GIFTEK', PL, 20);

  doc.setFontSize(8); setTxt('#888884');
  doc.text('Villa María · Córdoba', PL, 27);

  // Badge
  setFill('#1a2a1a'); setDraw('#34d399');
  doc.setLineWidth(0.4);
  doc.roundedRect(W-PR-38, 12, 38, 10, 3, 3, 'FD');
  doc.setFontSize(8); doc.setFont('helvetica','bold'); setTxt('#34d399');
  doc.text('✓ GARANTÍA', W-PR-35, 18.5);

  // Blue title bar
  setFill('#4f8aff'); doc.rect(0, 38, W, 10, 'F');
  doc.setFontSize(9); doc.setFont('helvetica','bold'); setTxt('#ffffff');
  doc.text(`CERTIFICADO DE GARANTÍA · ${dias} DÍAS`, PL, 44.5);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`N° ${nro}`, W-PR, 44.5, { align: 'right' });

  let y = 56;

  // Section helper
  function sectionTitle(title, yy) {
    doc.setFontSize(8); doc.setFont('helvetica','bold'); setTxt('#4f8aff');
    doc.text(title.toUpperCase(), PL, yy);
    setDraw('#2a2a38'); doc.setLineWidth(0.3);
    doc.line(PL, yy+2, W-PR, yy+2);
    return yy + 8;
  }

  function field(label, value, x, yy, w=80) {
    doc.setFontSize(7); doc.setFont('helvetica','normal'); setTxt('#888884');
    doc.text(label, x, yy);
    doc.setFontSize(10); doc.setFont('helvetica','bold'); setTxt('#111110');
    doc.text(String(value), x, yy+5);
  }

  // CLIENTE
  y = sectionTitle('Datos del cliente', y);
  field('CLIENTE', cliente, PL, y);
  field('DNI', dni, PL+95, y);
  y += 12;
  field('TELÉFONO', tel, PL, y);
  y += 14;

  // EQUIPO
  y = sectionTitle('Equipo vendido', y);
  doc.setFontSize(11); doc.setFont('helvetica','bold'); setTxt('#111110');
  doc.text(modelo, PL, y+4);
  y += 10;
  field('IMEI / SERIE', imei, PL, y);
  field('CONDICIÓN', condicion, PL+70, y);
  field('PRECIO', precio, PL+115, y);
  y += 12;
  field('MÉTODO DE PAGO', pago, PL, y);
  y += 14;

  // COBERTURA
  y = sectionTitle('Cobertura incluida', y);
  if (cob.length === 0) {
    doc.setFontSize(9); doc.setFont('helvetica','italic'); setTxt('#888884');
    doc.text('Sin coberturas seleccionadas', PL, y);
    y += 8;
  } else {
    cob.forEach(c => {
      setFill('#34d399'); doc.circle(PL+1.5, y-1.2, 1.2, 'F');
      doc.setFontSize(9); doc.setFont('helvetica','normal'); setTxt('#333333');
      doc.text(c, PL+5, y);
      y += 7;
    });
    y += 2;
  }

  // NOTAS
  if (notas) {
    y = sectionTitle('Observaciones', y);
    setFill('#f9f8f5'); doc.roundedRect(PL, y-2, CW, 16, 2, 2, 'F');
    doc.setFontSize(9); doc.setFont('helvetica','normal'); setTxt('#555555');
    const lines = doc.splitTextToSize(notas, CW-6);
    doc.text(lines, PL+3, y+4);
    y += 20;
  }

  // VIGENCIA
  setFill('#111110'); doc.roundedRect(PL, y, CW, 22, 3, 3, 'F');
  doc.setFontSize(8); doc.setFont('helvetica','bold'); setTxt('#888884');
  doc.text('PERÍODO DE GARANTÍA', PL+4, y+7);
  doc.setFontSize(8); doc.setFont('helvetica','normal'); setTxt('#888884');
  doc.text(`${dias} días corridos`, PL+4, y+13);
  doc.setFontSize(9); doc.setFont('helvetica','bold'); setTxt('#ffffff');
  doc.text(`Desde: ${desde}`, W-PR-70, y+8);
  doc.text(`Hasta: ${hasta}`, W-PR-70, y+15);
  y += 28;

  // EXCLUSIONES
  doc.setFontSize(7.5); doc.setFont('helvetica','italic'); setTxt('#888884');
  const excl = 'La garantía NO cubre: pantalla (rota, rayada o con manchas), daños por caídas, golpes, líquidos, mal uso o intervención de terceros no autorizados. Para hacer válida la garantía presentar este certificado.';
  const exclLines = doc.splitTextToSize(excl, CW);
  doc.text(exclLines, PL, y);
  y += exclLines.length * 4 + 8;

  // FOOTER
  setFill('#f5f4f0'); doc.rect(0, 277, W, 20, 'F');
  setDraw('#e8e6e0'); doc.setLineWidth(0.3); doc.line(0, 277, W, 277);
  doc.setFontSize(8); doc.setFont('helvetica','normal'); setTxt('#888884');
  doc.text('GIFTEK · Villa María, Córdoba · Consultas por WhatsApp', PL, 286);
  // Firma
  setDraw('#cccccc'); doc.setLineWidth(0.5);
  doc.line(W-PR-50, 283, W-PR, 283);
  doc.setFontSize(7); setTxt('#aaaaaa');
  doc.text('Firma y sello', W-PR-25, 287, { align: 'center' });

  doc.save(`Garantia_GIFTEK_${cliente.replace(/\s/g,'_')}.pdf`);
}

// Init
document.getElementById('f-fecha').value = new Date().toISOString().split('T')[0];
updatePreview();
</script>
